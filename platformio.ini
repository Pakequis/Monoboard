;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Explicit default so a bare `pio run`/`pio test` (no -e) resolves to the
; production firmware env instead of erroring on "native" as an unknown
; board target or building the noise-test harness by accident.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -Iinclude
; Excludes the standalone WiFi-vs-lightning-sensor test harness (own
; setup()/loop(), see the wifi_lightning_noise_test env below) -- without
; this, linking the production firmware fails with a duplicate
; setup()/loop() definition.
build_src_filter = +<*> -<test_wifi_lightning_noise.cpp> -<test_as3935_monitor.cpp>
test_ignore = *
monitor_speed = 115200
lib_deps =
  GxEPD2
  adafruit/Adafruit GFX Library @ ^1.10.10
  adafruit/Adafruit BusIO @ ^1.9.1
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.9
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library @ ^1.2.0
  bblanchon/ArduinoJson @ ^6.21.5
  WiFi

; Standalone test harness (see src/test_wifi_lightning_noise.cpp) -- checks
; whether the ESP32-S3's own WiFi radio raises the AS3935's disturber/noise
; rate. Separate environment so it never gets built/flashed by accident
; instead of the production firmware; excludes every other src/*.cpp via
; build_src_filter so unrelated modules (display, content fetchers, etc.)
; aren't pulled into this build.
[env:wifi_lightning_noise_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -Iinclude -DAPP_DEBUG_SERIAL=1
build_src_filter =
  -<*>
  +<wifi_manager.cpp>
  +<test_wifi_lightning_noise.cpp>
test_ignore = *
monitor_speed = 115200
lib_deps =
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library @ ^1.2.0

; Standalone AS3935 event monitor (see src/test_as3935_monitor.cpp) --
; stays awake and logs every AS3935 interrupt with the chip's own
; classification (noise / disturber / lightning) plus distance/energy,
; to check whether counted "strikes" are real. Separate environment so
; it never gets flashed in place of the production firmware.
[env:as3935_monitor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM -Iinclude -DAPP_DEBUG_SERIAL=1
build_src_filter =
  -<*>
  +<test_as3935_monitor.cpp>
test_ignore = *
monitor_speed = 115200
lib_deps =
  sparkfun/SparkFun AS3935 Lightning Detector Arduino Library @ ^1.2.0

; The production firmware built with SHOW_SCREEN_RULER=1 (see
; lib/screen_ruler/ and config.h): on boot it draws the cm rulers +
; 10 cm calibration bar, latches the e-paper image and deep-sleeps for
; good, for physically templating an enclosure. Same binary as
; esp32-s3-devkitc-1 otherwise -- inherits all its settings and just
; adds the flag (plus serial logging). Flash the plain
; esp32-s3-devkitc-1 env to return to normal.
[env:screen_ruler]
extends = env:esp32-s3-devkitc-1
build_flags = ${env:esp32-s3-devkitc-1.build_flags} -DAPP_DEBUG_SERIAL=1 -DSHOW_SCREEN_RULER=1

; Host-native unit tests for the pure-logic helpers extracted into lib/
; (calendar math, weather-icon mapping, news-text cleanup). Builds and
; runs on this machine's own compiler, no ESP32 board involved -- run with
; `pio test -e native`, never `pio run -e native` (there's nothing to
; upload). Only test/ plus whatever lib/ modules a test #includes get
; built; src/ is never part of this environment.
[env:native]
platform = native
test_framework = unity
; Instrument only host-native code, allowing gcov to report the coverage of
; the pure-logic modules without affecting the ESP32 firmware build.
build_flags = -std=gnu++14 --coverage -lgcov
